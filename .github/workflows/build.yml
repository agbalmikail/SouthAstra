# Bir sürüm etiketi gönderildiğinde (ör. git tag v0.4.0 && git push --tags):
# testleri Mac ve Windows'ta çalıştırır, kurulum dosyalarını üretir ve GitHub Release'e ekler.
# Elle tetiklemede (Actions → Run workflow) yalnızca dosyaları üretir.
name: Kurulum dosyaları

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SouthAstra-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
          generate_release_notes: true

appId: com.southastra.app
productName: SouthAstra
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/ephe
    to: ephe
  - from: resources/cities.json.gz
    to: cities.json.gz
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/verification.json
    to: verification.json
asarUnpack:
  - node_modules/sweph/**/*
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  identity: null
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null

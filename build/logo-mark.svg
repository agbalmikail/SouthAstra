<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>SouthAstra</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc8a"/>
      <stop offset="0.45" stop-color="#e2b04e"/>
      <stop offset="1" stop-color="#b47a22"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c88f30"/>
      <stop offset="0.5" stop-color="#f1cf72"/>
      <stop offset="1" stop-color="#c88f30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d2"/>
      <stop offset="0.35" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#d9a441"/>
    </radialGradient>
    <radialGradient id="disk" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#2a3350"/>
      <stop offset="1" stop-color="#151a2a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="front"><rect x="-300" y="520" width="1700" height="700" transform="rotate(-24 512 520)"/></clipPath>
  </defs>
  <!-- arka plandaki koyu gezegen diski -->
  <circle cx="512" cy="520" r="318" fill="url(#disk)"/>
  <!-- yörünge (arka yarı) -->
  <ellipse cx="512" cy="520" rx="410" ry="118" transform="rotate(-24 512 520)" fill="none" stroke="url(#orbit)" stroke-width="13" opacity="0.55"/>
  <!-- S: iki altın hilal -->
  <path fill="url(#gold)" d="M736 236 C592 150 336 188 318 368 C306 486 392 540 512 578 C432 520 396 470 404 396 C418 270 576 214 736 236 Z"/>
  <path fill="url(#gold)" d="M288 788 C432 874 688 836 706 656 C718 538 632 484 512 446 C592 504 628 554 620 628 C606 754 448 810 288 788 Z"/>
  <!-- yörünge (ön yarı: S'nin önünden geçen kısım) -->
    <ellipse cx="512" cy="520" rx="410" ry="118" transform="rotate(-24 512 520)" fill="none" stroke="url(#orbit)" stroke-width="13" clip-path="url(#front)"/>
  <!-- gezegen -->
  <circle cx="196" cy="672" r="30" fill="url(#gold)"/>
  <!-- sekiz köşeli yıldız -->
  <g transform="translate(512 512)">
    <path fill="url(#glow)" d="M0 -168 L22 -22 L168 0 L22 22 L0 168 L-22 22 L-168 0 L-22 -22 Z"/>
    <path fill="url(#glow)" opacity="0.9" d="M0 0 L66 -66 L18 -6 Z M0 0 L66 66 L6 18 Z M0 0 L-66 66 L-18 6 Z M0 0 L-66 -66 L-6 -18 Z"/>
    <circle r="16" fill="#fff8de"/>
  </g>
  <!-- küçük parıltılar -->
  <g fill="#f3d27a">
    <path transform="translate(774 214)" d="M0 -24 L5 -5 L24 0 L5 5 L0 24 L-5 5 L-24 0 L-5 -5 Z"/>
    <path transform="translate(700 372)" d="M0 -15 L3 -3 L15 0 L3 3 L0 15 L-3 3 L-15 0 L-3 -3 Z"/>
    <path transform="translate(328 712)" d="M0 -17 L4 -4 L17 0 L4 4 L0 17 L-4 4 L-17 0 L-4 -4 Z"/>
    <circle cx="250" cy="300" r="5"/>
    <circle cx="820" cy="560" r="4"/>
  </g>
</svg>
